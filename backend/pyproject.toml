[project]
name = "backend"
version = "0.1.0"
description = "clariFi backend — FastAPI API for analyzing credit-card spending from CSV uploads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP",          # pycodestyle, pyflakes, isort, bugbear, pyupgrade
  "SIM", "C4", "RET", "PIE", "RUF",  # simplify, comprehensions, returns, misc, ruff-native
  "FURB", "PERF", "RSE",             # refurb (modernize), perflint, raise
  "TC",                              # flake8-type-checking (move annotation-only imports)
  "DTZ",                             # flake8-datetimez — forbid naive datetime
]
ignore = [
  "B008",  # function-call-in-default-argument — Depends(...) is idiomatic FastAPI
]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
